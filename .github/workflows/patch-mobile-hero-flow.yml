name: Patch mobile hero process flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-mobile-hero-flow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Let the mobile NPD card determine its own height
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/site.css')
          css = path.read_text(encoding='utf-8')
          old = "  .hero-panel { min-height: 440px; }\n  .hero-panel__back { inset: 0 20px 30px 0; }\n  .hero-panel__card { inset: 22px 0 0 20px; padding: 24px; }\n"
          new = "  .hero-panel { min-height: 0; padding: 22px 0 30px 20px; }\n  .hero-panel__back { inset: 0 20px 30px 0; }\n  .hero-panel__card { position: relative; inset: auto; min-height: 0; padding: 24px; }\n"
          if new in css:
              print('Mobile hero flow fix already present.')
          elif old in css:
              path.write_text(css.replace(old, new, 1), encoding='utf-8')
              print('Inserted natural-height mobile hero card rule.')
          else:
              raise SystemExit('Expected mobile hero rules were not found.')
          PY

      - name: Validate generated pages
        env:
          PUBLISH_MODE: preview
          SITE_URL: https://lp.technologzywnosci.pl
        run: npm test

      - name: Commit mobile flow correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/site.css
          if git diff --cached --quiet; then
            echo 'No CSS changes.'
          else
            git commit -m 'Napraw wysokość karty procesu NPD na telefonach'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
