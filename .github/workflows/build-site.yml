name: Build and validate 1026 city pages

on:
  push:
    branches: [main]
    paths:
      - 'data/cities.json'
      - 'src/**'
      - 'scripts/build-site.mjs'
      - 'scripts/validate-site.mjs'
      - 'scripts/serve.mjs'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/build-site.yml'
  workflow_dispatch:

concurrency:
  group: build-city-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify existing Warsaw URL compatibility
        run: |
          grep -q '"name": "Warszawa"' data/cities.json
          grep -q '"slug": "warszawa"' data/cities.json

      - name: Build preview and run full validation
        env:
          PUBLISH_MODE: preview
          SITE_URL: https://lp.technologzywnosci.pl
        run: npm test

      - name: Preserve preview build
        run: mv dist dist-preview

      - name: Validate production indexing switch
        env:
          PUBLISH_MODE: production
          SITE_URL: https://lp.technologzywnosci.pl
        run: |
          npm test
          grep -q 'Allow: /' dist/robots.txt
          grep -q 'Sitemap: https://lp.technologzywnosci.pl/sitemap.xml' dist/robots.txt
          test -f dist/technolog-zywnosci-warszawa.html
          grep -q 'content="index,follow,max-image-preview:large"' dist/technolog-zywnosci-warszawa.html

      - name: Restore safe preview build
        if: always()
        run: |
          rm -rf dist
          if [ -d dist-preview ]; then mv dist-preview dist; fi

      - name: Install browser for visual smoke test
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Visual and interaction smoke test
        run: |
          node scripts/serve.mjs > /tmp/city-site.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          mkdir -p qa-screenshots
          cat > qa-smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const browser = await chromium.launch({ headless: true });
          const consoleErrors = [];

          async function revealWholePage(page) {
            await page.evaluate(async () => {
              const delay = (milliseconds) => new Promise(resolve => setTimeout(resolve, milliseconds));
              const step = Math.max(360, Math.floor(window.innerHeight * 0.65));
              const height = document.documentElement.scrollHeight;

              for (let y = 0; y < height; y += step) {
                window.scrollTo(0, y);
                await delay(65);
              }

              window.scrollTo(0, document.documentElement.scrollHeight);
              await delay(180);
              window.scrollTo(0, 0);
              await delay(180);
            });

            for (let pass = 0; pass < 3; pass += 1) {
              const remaining = page.locator('[data-reveal]:not(.is-visible):visible');
              const count = await remaining.count();
              if (count === 0) break;

              for (let index = count - 1; index >= 0; index -= 1) {
                const element = remaining.nth(index);
                if (await element.count()) {
                  await element.scrollIntoViewIfNeeded();
                  await page.waitForTimeout(90);
                }
              }
            }

            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(180);
          }

          async function captureSections(page, name) {
            const sections = [
              ['hero', '.hero'],
              ['scope', '#zakres'],
              ['experience', '#doswiadczenie'],
              ['contact', '#kontakt'],
            ];

            for (const [label, selector] of sections) {
              const locator = page.locator(selector).first();
              if (await locator.count()) {
                await locator.screenshot({ path: `qa-screenshots/${name}-${label}.png` });
              }
            }
            await page.evaluate(() => window.scrollTo(0, 0));
          }

          async function audit(name, url, viewport) {
            const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
            page.on('console', message => {
              if (message.type() === 'error') consoleErrors.push(`${name}: ${message.text()}`);
            });
            page.on('pageerror', error => consoleErrors.push(`${name}: ${error.message}`));

            const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            if (!response?.ok()) throw new Error(`${name}: HTTP ${response?.status()}`);

            await revealWholePage(page);
            const hiddenRevealCount = await page.locator('[data-reveal]:not(.is-visible):visible').count();
            if (hiddenRevealCount !== 0) {
              const hiddenRevealDetails = await page.locator('[data-reveal]:not(.is-visible):visible').evaluateAll(elements => elements.map(element => ({
                tag: element.tagName.toLowerCase(),
                id: element.id || '',
                className: typeof element.className === 'string' ? element.className : '',
                text: (element.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 120),
              })));
              throw new Error(`${name}: ${hiddenRevealCount} visible reveal elements remained hidden: ${JSON.stringify(hiddenRevealDetails)}`);
            }

            await page.screenshot({ path: `qa-screenshots/${name}.png`, fullPage: true });
            await captureSections(page, name);

            const geometry = await page.evaluate(() => {
              const viewportWidth = document.documentElement.clientWidth;
              const bodyWidth = document.body.scrollWidth;
              const describe = (element) => {
                const rect = element.getBoundingClientRect();
                const style = getComputedStyle(element);
                return {
                  tag: element.tagName.toLowerCase(),
                  id: element.id || '',
                  className: typeof element.className === 'string' ? element.className : '',
                  left: Number(rect.left.toFixed(2)),
                  right: Number(rect.right.toFixed(2)),
                  width: Number(rect.width.toFixed(2)),
                  clientWidth: element.clientWidth,
                  scrollWidth: element.scrollWidth,
                  overflowX: style.overflowX,
                  position: style.position,
                  transform: style.transform,
                  text: (element.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 120),
                };
              };

              const all = Array.from(document.querySelectorAll('*'));
              const outside = all
                .map(describe)
                .filter(item => item.left < -0.5 || item.right > viewportWidth + 0.5 || item.width > viewportWidth + 0.5 || item.scrollWidth > item.clientWidth + 1)
                .slice(0, 80);

              const removalImpact = [];
              if (bodyWidth > viewportWidth + 1) {
                for (const element of all) {
                  if (['HTML', 'BODY', 'HEAD', 'SCRIPT', 'STYLE', 'LINK', 'META'].includes(element.tagName)) continue;
                  const previous = element.getAttribute('style');
                  element.style.setProperty('display', 'none', 'important');
                  const reducedWidth = document.body.scrollWidth;
                  if (reducedWidth < bodyWidth) {
                    removalImpact.push({ ...describe(element), reducedBodyWidth: reducedWidth });
                  }
                  if (previous === null) element.removeAttribute('style');
                  else element.setAttribute('style', previous);
                }
              }

              return { viewportWidth, bodyWidth, outside, removalImpact: removalImpact.slice(-50) };
            });

            const result = {
              title: await page.title(),
              h1: await page.locator('h1').first().innerText(),
              h1Count: await page.locator('h1').count(),
              bodyWidth: geometry.bodyWidth,
              viewportWidth: geometry.viewportWidth,
              formCount: await page.locator('[data-contact-form]').count(),
              hiddenRevealCount,
              outside: geometry.outside,
              removalImpact: geometry.removalImpact,
            };
            await writeFile(`qa-screenshots/${name}.json`, JSON.stringify(result, null, 2));
            console.log(JSON.stringify({ audit: name, ...result }, null, 2));

            if (result.h1Count !== 1) throw new Error(`${name}: expected one H1`);
            if (result.bodyWidth > result.viewportWidth + 1) {
              throw new Error(`${name}: horizontal overflow ${result.bodyWidth}/${result.viewportWidth}`);
            }
            await page.close();
            return result;
          }

          const results = [];
          results.push(await audit('hub-desktop', 'http://127.0.0.1:4173/', { width: 1440, height: 1000 }));
          results.push(await audit('warszawa-desktop', 'http://127.0.0.1:4173/technolog-zywnosci-warszawa', { width: 1440, height: 1000 }));
          results.push(await audit('warszawa-mobile', 'http://127.0.0.1:4173/technolog-zywnosci-warszawa', { width: 390, height: 844 }));

          const hub = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          await hub.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          if (await hub.locator('[data-city-card]').count() !== 1026) throw new Error('Hub does not contain exactly 1026 city links');
          await hub.locator('[data-city-search]').fill('Warszawa');
          if (await hub.locator('[data-city-card]:visible').count() !== 1) throw new Error('City search did not narrow results to one Warsaw entry');
          await hub.close();

          if (consoleErrors.length) throw new Error(`Browser errors:\n${consoleErrors.join('\n')}`);
          await writeFile('qa-screenshots/smoke-results.json', JSON.stringify(results, null, 2));
          await browser.close();
          JS
          node qa-smoke.mjs

      - name: Publish validated preview artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bw-food-consulting-1026-miast-preview
          path: dist
          retention-days: 14
          if-no-files-found: error

      - name: Publish visual QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bw-food-consulting-1026-miast-screenshots
          path: qa-screenshots
          retention-days: 14
          if-no-files-found: warn
