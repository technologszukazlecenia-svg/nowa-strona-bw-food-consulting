name: Capture current Landingi references

on:
  push:
    paths:
      - '.github/workflows/capture-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture sitemap and reference pages
        run: |
          mkdir -p reference
          curl --fail --location --retry 4 --retry-all-errors \
            'https://lp.technologzywnosci.pl/sitemap.xml' \
            --output reference/sitemap.xml
          cat > capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const pages = [
            ['warszawa', 'https://lp.technologzywnosci.pl/technolog-zywnosci-warszawa'],
            ['lodz', 'https://lp.technologzywnosci.pl/technolog-zywnosci-lodz'],
          ];

          const browser = await chromium.launch({ headless: true });
          for (const [name, url] of pages) {
            for (const [viewportName, viewport] of [
              ['desktop', { width: 1440, height: 1000 }],
              ['mobile', { width: 390, height: 844 }],
            ]) {
              const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
              await page.route('**/*', async route => {
                const type = route.request().resourceType();
                if (['media', 'font'].includes(type)) return route.abort();
                return route.continue();
              });
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 90000 });
              await page.waitForTimeout(5000);
              await page.screenshot({ path: `reference/${name}-${viewportName}.png`, fullPage: true });
              if (viewportName === 'desktop') {
                await writeFile(`reference/${name}.html`, await page.content(), 'utf8');
                const audit = await page.evaluate(() => ({
                  title: document.title,
                  description: document.querySelector('meta[name="description"]')?.content || '',
                  canonical: document.querySelector('link[rel="canonical"]')?.href || '',
                  headings: Array.from(document.querySelectorAll('h1,h2,h3')).map(node => ({
                    level: node.tagName.toLowerCase(),
                    text: node.textContent?.replace(/\s+/g, ' ').trim() || '',
                  })),
                  links: Array.from(document.querySelectorAll('a[href]')).map(node => ({
                    text: node.textContent?.replace(/\s+/g, ' ').trim() || '',
                    href: node.href,
                  })),
                  forms: Array.from(document.querySelectorAll('form')).map(form => ({
                    action: form.action,
                    method: form.method,
                    fields: Array.from(form.querySelectorAll('input,textarea,select')).map(field => ({
                      tag: field.tagName.toLowerCase(),
                      type: field.getAttribute('type') || '',
                      name: field.getAttribute('name') || '',
                      placeholder: field.getAttribute('placeholder') || '',
                    })),
                  })),
                }));
                await writeFile(`reference/${name}-audit.json`, JSON.stringify(audit, null, 2), 'utf8');
              }
              await page.close();
            }
          }
          await browser.close();
          JS
          node capture.mjs
      - name: Upload visual reference
        uses: actions/upload-artifact@v4
        with:
          name: landingi-reference
          path: reference
          retention-days: 3
