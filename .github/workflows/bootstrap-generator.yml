name: Install city landing generator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-generator.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-city-generator
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct generator package
        run: |
          cat .bootstrap/generator.part00 .bootstrap/generator.part01 .bootstrap/generator.part02 .bootstrap/generator.part03 .bootstrap/generator.part04 \
            | base64 --decode > /tmp/sitegen-generator.tgz
          echo '87aae315b5772a8ce9088637d6b3519bf6dd5b8bcb9fafd21b6ba42d25038cca  /tmp/sitegen-generator.tgz' \
            | sha256sum --check
          tar -xzf /tmp/sitegen-generator.tgz
          rm -f .github/workflows/build-site.yml

      - name: Validate all 1026 pages before commit
        env:
          PUBLISH_MODE: preview
          SITE_URL: https://lp.technologzywnosci.pl
        run: npm test

      - name: Commit generator without workflow files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .gitignore package.json vercel.json src scripts
          git commit -m 'Generator: 1026 niezależnych stron miejskich'
          git pull --rebase origin main
          git push origin HEAD:main
